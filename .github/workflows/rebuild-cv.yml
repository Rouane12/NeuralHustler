name: Rebuild CV PDF

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_cv.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CV dependencies
        run: python -m pip install --upgrade reportlab pillow qrcode

      - name: Build CV PDF
        run: python scripts/build_cv.py

      - name: Commit generated CV
        run: |
          if git diff --quiet -- assets/documents/Rouane-Mounssif-CV.pdf; then
            echo "CV is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/documents/Rouane-Mounssif-CV.pdf
          git commit -m "Update Rouane Mounssif CV"
          git push
